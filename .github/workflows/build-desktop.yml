# =====================================================================
# Pulse — Build Desktop Releases
# =====================================================================
# Builds Windows (.exe) and macOS (.dmg) installers on every version tag
# and uploads them as GitHub Release assets.
#
# Trigger:
#   - Push a tag like "v1.8.0" to create a release
#   - Manual dispatch from the Actions tab
#
# Release assets:
#   - Pulse-Windows.zip (stable Windows download alias)
#   - Pulse-macOS.dmg (stable macOS download alias)
# =====================================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.8.0)'
        required: false
        default: ''

env:
  # Must match build.sh — pubspec deps (font_awesome_flutter 11.0.0 etc.)
  # require Dart >= 3.9, which needs Flutter 3.38.x. Older Flutter (3.24.x)
  # fails `flutter pub get` resolution.
  FLUTTER_VERSION: '3.38.2'
  JAVA_VERSION: '17'

jobs:
  # -------------------------------------------------------------------
  # Build Windows
  # -------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ($version -eq "") { $version = "${{ github.ref_name }}" -replace '^v','' }
          flutter build windows --release --build-name="$version" --build-number="${{ github.run_number }}"

      - name: Create Windows installer
        # Install Inno Setup 6 directly via Chocolatey and compile with
        # `iscc` — more reliable than the unmaintained
        # nicoj04/inno-setup-action@v1 which failed on 2026-08-20.
        run: |
          choco install innosetup -y --no-progress
          iscc installer/duniya_setup.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows
          path: installer/Output/
          retention-days: 5

  # -------------------------------------------------------------------
  # Build macOS
  # -------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      # Note: no `pod install` step — the project uses Flutter's modern
      # Swift Package Manager integration (no Podfile; flutter build macos
      # resolves plugin packages automatically). Explicitly enabling SPM
      # keeps the build deterministic across Flutter versions.

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Build macOS app
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${{ github.ref_name }}"; version="${version#v}"; fi
          flutter build macos --release --build-name="$version" --build-number="${{ github.run_number }}"

      - name: Create macOS DMG
        run: |
          mkdir -p release
          cp -R build/macos/Build/Products/Release/Pulse.app release/
          hdiutil create -volname "Pulse" -srcfolder release/Pulse.app -ov -format UDZO release/Pulse.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-macOS
          path: release/Pulse.dmg
          retention-days: 5

  # -------------------------------------------------------------------
  # Create GitHub Release
  # -------------------------------------------------------------------
  # Runs on tag pushes (the canonical release flow) AND on manual
  # workflow_dispatch from the Actions tab — in the dispatch case the
  # release is created as a DRAFT so the maintainer can review the
  # built assets before publishing them to end users via the
  # "latest/download/Pulse-Windows.zip" alias URLs.
  create-release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag name
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.version }}"
            TAG="${INPUT:-dev-$(date +%Y%m%d-%H%M%S)}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing as: $TAG"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Pulse-Windows
          path: release/windows/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Pulse-macOS
          path: release/macos/

      - name: Create ZIP for Windows
        run: |
          cd release/windows
          zip -r ../Pulse-Setup-${{ steps.rel.outputs.tag }}.zip ./
          cd ../..

      - name: Rename macOS DMG
        run: |
          mv release/macos/Pulse.dmg release/Pulse-${{ steps.rel.outputs.tag }}.dmg

      - name: Create stable download aliases
        run: |
          cp release/Pulse-Setup-${{ steps.rel.outputs.tag }}.zip release/Pulse-Windows.zip
          cp release/Pulse-${{ steps.rel.outputs.tag }}.dmg release/Pulse-macOS.dmg

      - name: Decide draft / prerelease
        id: dflags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "draft=true"  >> "$GITHUB_OUTPUT"
            echo "pre=true"    >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "pre=false"   >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Pulse ${{ steps.rel.outputs.tag }}
          body: |
            ## Pulse ${{ steps.rel.outputs.tag }}

            ### Downloads
            - **Windows**: Download `Pulse-Setup-${{ steps.rel.outputs.tag }}.zip` — extract and run `Pulse-Setup.exe`, then follow the installer wizard
            - **macOS**: Download `Pulse-${{ steps.rel.outputs.tag }}.dmg` — open and drag Pulse to Applications
            - Stable links: `Pulse-Windows.zip` and `Pulse-macOS.dmg` always point to the latest published release.

            ### System Requirements
            - Windows 10+ (64-bit) or macOS 12+ (Apple Silicon & Intel)
            - 4 GB RAM minimum
            - 200 MB disk space

            ### What's New
            See the commit history for changes in this release.
          files: |
            release/Pulse-Setup-${{ steps.rel.outputs.tag }}.zip
            release/Pulse-${{ steps.rel.outputs.tag }}.dmg
            release/Pulse-Windows.zip
            release/Pulse-macOS.dmg
          draft: ${{ steps.dflags.outputs.draft }}
          prerelease: ${{ steps.dflags.outputs.pre }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

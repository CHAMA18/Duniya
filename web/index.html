<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Cache-busting: prevent browser/CDN from caching the HTML shell -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Build version — injected by build.sh at deploy time -->
  <meta name="build-version" content="DEV">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duniya">
  <meta name="application-name" content="Duniya">
  <meta name="theme-color" content="#9900FF">
  <meta name="description" content="Duniya — pharmacy and inventory management for modern health teams.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="duniya, pharmacy, inventory, stock, health, management">
  <meta name="author" content="Duniya">
  <meta property="og:title" content="Duniya">
  <meta property="og:description" content="Duniya — pharmacy and inventory management for modern health teams.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="Artboard_1.png">

  <!-- Favicon (Duniya logo) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="twitter:title" content="Duniya">
  <meta name="twitter:description" content="Duniya — pharmacy and inventory management for modern health teams.">
  <meta name="twitter:image" content="Artboard_1.png">
  <meta name="twitter:card" content="summary_large_image" />

  <title>Duniya</title>

  <link rel="manifest" href="manifest.json">

  <!-- Satoshi Font — global application font -->
  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/Satoshi-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/Satoshi-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    /* Apply Satoshi globally */
    * {
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
  </style>

</head>
<body>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA3-HDfLffnuYVQUL4aR6DDPNqFWr5navE"></script>



  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Cache-busting: prevent browser/CDN from caching the HTML shell -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Build version — injected by build.sh at deploy time (cache busting) -->
  <meta name="build-version" content="DEV">
  <!-- Cache-busting version — forces browsers/CDNs to fetch fresh manifest -->
  <meta name="cache-version" content="%%BUILD_VERSION%%">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <meta name="application-name" content="Pulse">
  <meta name="theme-color" content="#9900FF">
  <meta name="description" content="Pulse — pharmacy and inventory management for modern health teams.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="pulse, pharmacy, inventory, stock, health, management">
  <meta name="author" content="Pulse">
  <meta property="og:title" content="Pulse">
  <meta property="og:description" content="Pulse — pharmacy and inventory management for modern health teams.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="Artboard_1.png">

  <!-- Favicon — Pulse logo (multi-format, multi-size for max compatibility) -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="twitter:title" content="Pulse">
  <meta name="twitter:description" content="Pulse — pharmacy and inventory management for modern health teams.">
  <meta name="twitter:image" content="Artboard_1.png">
  <meta name="twitter:card" content="summary_large_image" />

  <title>Pulse</title>

  <link rel="manifest" href="manifest.json?v=%%BUILD_VERSION%%">

  <style>
    /* Flutter loads the bundled static Satoshi faces through FontManifest.
       This rule keeps any HTML fallback content aligned with the app. */
    * {
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    }
  </style>

</head>
<body>

  <!-- Keep the marketing experience first when this shell is served directly.
       The production build moves this Flutter shell to /app.html, so this
       guard only affects direct root loads in development or generic hosts. -->
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path === '/' || path === '/index.html') {
        window.location.replace('/landing.html' + window.location.search + window.location.hash);
        return;
      }

      // Static hosts can serve /app.html but may not apply SPA rewrites for
      // routes such as /loginUni. The landing page therefore opens this
      // guaranteed shell and supplies the desired Flutter path explicitly.
      var route = new URLSearchParams(window.location.search).get('route');
      if (route && route.charAt(0) === '/' && !route.startsWith('//')) {
        window.history.replaceState(null, '', route + window.location.hash);
      }
    })();
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA3-HDfLffnuYVQUL4aR6DDPNqFWr5navE&loading=async" async></script>

  <!-- Cache-bust: force fresh flutter_bootstrap.js on every deploy -->
  <!-- Build version: %%BUILD_VERSION%% (injected by build.sh) -->

  <!-- Satoshi is bundled in FontManifest. CanvasKit loads it from the asset
       bundle, not CSS, so the Flutter canvas and HTML fallbacks stay aligned. -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>

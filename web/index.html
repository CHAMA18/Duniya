<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Cache-busting: prevent browser/CDN from caching the HTML shell -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Build version — injected by build.sh at deploy time (cache busting) -->
  <meta name="build-version" content="DEV">
  <!-- Cache-busting version — forces browsers/CDNs to fetch fresh manifest -->
  <meta name="cache-version" content="%%BUILD_VERSION%%">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duniya">
  <meta name="application-name" content="Duniya">
  <meta name="theme-color" content="#9900FF">
  <meta name="description" content="Duniya — pharmacy and inventory management for modern health teams.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="duniya, pharmacy, inventory, stock, health, management">
  <meta name="author" content="Duniya">
  <meta property="og:title" content="Duniya">
  <meta property="og:description" content="Duniya — pharmacy and inventory management for modern health teams.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="Artboard_1.png">

  <!-- Favicon — Duniya logo (multi-format, multi-size for max compatibility) -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="twitter:title" content="Duniya">
  <meta name="twitter:description" content="Duniya — pharmacy and inventory management for modern health teams.">
  <meta name="twitter:image" content="Artboard_1.png">
  <meta name="twitter:card" content="summary_large_image" />

  <title>Duniya</title>

  <link rel="manifest" href="manifest.json?v=%%BUILD_VERSION%%">

  <!-- Font: Use Inter on web (Satoshi causes CanvasKit null-check errors) -->
  <!-- Inter is visually similar to Satoshi and works reliably with Skia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Apply Inter globally on web — Satoshi TTF causes null-check errors
       in CanvasKit's Skia text renderer (font variation table issue).
       Inter is the same font used on the landing page and is web-safe. */
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
  </style>

</head>
<body>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA3-HDfLffnuYVQUL4aR6DDPNqFWr5navE&loading=async" async></script>

  <!-- Cache-bust: force fresh flutter_bootstrap.js on every deploy -->
  <!-- Build version: %%BUILD_VERSION%% (injected by build.sh) -->

  <!-- Wait for fonts to be ready before starting Flutter.
       CanvasKit's font manager needs the Inter font to be fully loaded
       before it can measure/render text. Without this, the first frame
       triggers "Cannot read properties of null (reading 'w')" because
       the font lookup returns null for fonts that haven't loaded yet. -->
  <script>
    (async function() {
      // Wait for all declared fonts to finish loading
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
        console.log('[Duniya] Fonts ready — starting Flutter engine');
      }
      // Now load and start Flutter
      {{flutter_bootstrap_js}}
    })();
  </script>
</body>
</html>
